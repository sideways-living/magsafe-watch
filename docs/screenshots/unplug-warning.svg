  <text x="720" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="52" font-weight="800" fill="#111827">Plug MagSafe back in</text>
  <text x="720" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="22" font-weight="500" fill="#3f4650">Power is disconnected and this Mac appears to be sitting at your desk.</text>
