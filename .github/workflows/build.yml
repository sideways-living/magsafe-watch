name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "outputs/MagSafe Watch.app"
          plutil -lint "outputs/MagSafe Watch.app/Contents/Info.plist"
